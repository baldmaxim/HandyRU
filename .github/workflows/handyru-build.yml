name: "HandyRU Build"

# Unsigned installers for HandyRU. The fork has no signing certificates, so
# macOS shows a Gatekeeper warning on first launch and Windows a SmartScreen one.
# Run: gh workflow run handyru-build.yml -R baldmaxim/HandyRU

on: workflow_dispatch

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26" # Apple Silicon (M1 and above)
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      asset-prefix: "handyru"
      upload-artifacts: true
    # Updater signing key (TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]).
    secrets: inherit
