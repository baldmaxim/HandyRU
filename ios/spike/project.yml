# XcodeGen: проект HandySpike. Генерация: xcodegen generate (её запускает build-core.sh).
name: HandySpike
options:
  bundleIdPrefix: com.handyru
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  HandySpike:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.handyru.spike
        PRODUCT_NAME: HandySpike
        # Команду (Team) выбирает пользователь в Xcode: Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        # Только iPhone, только устройство (arm64), без симулятора.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: iphoneos
        ARCHS: arm64
        # Мост к C ABI ядра.
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/core/include/handy_spike_core.h
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/lib
        # -lc++ для ggml; -liconv нужен стандартной библиотеке Rust.
        OTHER_LDFLAGS: -lhandy_spike_core -lc++ -liconv
    dependencies:
      - sdk: Metal.framework
      # MetalKit есть в списке frameworks сборки transcribe-cpp-sys (ggml-metal).
      - sdk: MetalKit.framework
      - sdk: Accelerate.framework
      - sdk: Foundation.framework
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Handy Spike
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Нужен микрофон, чтобы записать речь и замерить распознавание.
        UIBackgroundModes:
          - audio
        # Журнал лежит в Documents: виден в приложении «Файлы» даже после аварийного завершения.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    entitlements:
      path: Generated/HandySpike.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true

schemes:
  HandySpike:
    build:
      targets:
        HandySpike: all
    # Замеры только в Release: оптимизированный Swift и без накладных расходов отладки.
    run:
      config: Release
